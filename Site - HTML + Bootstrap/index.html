<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Cotação de Moedas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <h1 class="h3 titulo mb-1">
                    Sistema de Cotação de Moedas
                </h1>
                <p class="text-secondary">
                    Será cobrada uma taxa de cotação de 
                    <strong class="laranja" id="textoTaxa">
                        10%
                    </strong> sobre o valor informado.
                </p>

                <div class="card painel shadow-sm">
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label for="valorReal" class="form-label">
                                Valor em Reais (R$)
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    R$
                                </span>
                                <input type="text" inputmode="numeric" class="form-control" id="valorReal"
                                    placeholder="0,00" autocomplete="off">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="moeda" class="form-label">
                                Converter para
                            </label>
                            <select class="form-select" id="moeda">
                                <option value="dolar">
                                    Dólar (US$)
                                </option>
                                <option value="euro">
                                    Euro (€)
                                </option>
                                <option value="bitcoin">
                                    Bitcoin (₿)
                                </option>
                            </select>
                        </div>

                        <div id="erro" class="alert alert-danger d-none" role="alert"></div>

                        <div class="d-flex gap-2">
                            <button id="btnConverter" class="btn btn-laranja flex-grow-1">
                                Converter
                            </button>
                            <button id="btnLimpar" class="btn btn-outline-secondary">
                                Limpar
                            </button>
                        </div>
                    </div>
                </div>

                <div id="relatorio" class="card painel shadow-sm mt-4 d-none">
                    <div class="card-header fw-semibold">
                        Relatório da Cotação
                    </div>
                    <div class="card-body">
                        <p class="mb-1 text-secondary">
                            Valor convertido
                        </p>
                        <p class="resultado-valor mb-3" id="resConvertido"></p>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between px-0">
                                <span>
                                    Valor informado
                                </span>
                                <span id="resInformado"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between px-0">
                                <span>
                                    Taxa de cotação
                                </span><span id="resTaxa"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between px-0">
                                <span>
                                    Valor após a taxa
                                </span><span id="resLiquido"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between px-0">
                                <span>
                                    Cotação usada
                                </span><span id="resCotacao"></span>
                            </li>
                        </ul>
                    </div>
                </div>

                <p class="text-secondary small mt-3 mb-0">
                    Cotações de referência do dia 03/11/26.
                </p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
